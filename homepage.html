<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess AI - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; background-color: #f4f7fb; } </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md sticky top-0 px-6 py-5 flex justify-between items-center rounded-b-[2rem] shadow-sm z-50">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">Hi, Student 👋</h2>
            <p class="text-sm text-gray-500 font-medium">Ready for your meal?</p>
        </div>
        <img src="https://ui-avatars.com/api/?name=Student&background=f97316&color=fff" class="w-12 h-12 rounded-full shadow-md" alt="Profile">
    </header>

    <main class="p-6 max-w-md mx-auto space-y-8 mt-2">
        
        <!-- Big Camera Card -->
        <div class="bg-gradient-to-br from-orange-400 to-red-500 rounded-[2rem] p-8 text-white shadow-xl shadow-orange-500/30 text-center cursor-pointer hover:shadow-2xl hover:-translate-y-1 active:scale-95 transition-all">
            <div class="bg-white/20 w-20 h-20 rounded-full flex items-center justify-center mx-auto mb-4 backdrop-blur-sm">
                <i class="fa-solid fa-camera text-3xl"></i>
            </div>
            <h3 class="text-2xl font-bold mb-1">Scan Mess Menu</h3>
            <p class="text-sm text-white/90">Point camera at the board or plate</p>
        </div>

        <div class="text-center">
            <span class="text-gray-400 text-sm font-bold tracking-widest uppercase">OR</span>
        </div>

        <!-- Manual Input Box -->
        <div class="bg-white p-2 rounded-2xl shadow-sm flex items-center border border-gray-100">
            <input type="text" placeholder="Type: Chole + 2 Roti..." class="w-full px-4 py-3 focus:outline-none text-gray-700 font-medium">
            <button class="bg-orange-500 text-white w-12 h-12 rounded-xl flex items-center justify-center hover:bg-orange-600 active:scale-90 transition-all">
                <i class="fa-solid fa-paper-plane"></i>
            </button>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav class="fixed bottom-6 left-6 right-6 bg-white rounded-3xl flex justify-around py-4 shadow-lg border border-gray-100">
        <a href="#" class="text-orange-500 flex flex-col items-center transform hover:-translate-y-1 transition-all"><i class="fa-solid fa-house text-xl mb-1"></i><span class="text-[10px] font-bold">Home</span></a>
        <a href="#" class="text-gray-400 flex flex-col items-center transform hover:-translate-y-1 hover:text-orange-500 transition-all"><i class="fa-solid fa-chart-pie text-xl mb-1"></i><span class="text-[10px] font-bold">Stats</span></a>
    </nav>

</body>
</html>
