<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess AI - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-[2rem] shadow-xl w-full max-w-sm mx-4 transform transition-all hover:scale-[1.01]">
        <div class="text-center mb-8">
            <div class="bg-orange-100 text-orange-500 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 text-3xl shadow-inner">
                <i class="fa-solid fa-utensils"></i>
            </div>
            <h1 class="text-3xl font-bold text-gray-800 tracking-tight">MessAI</h1>
            <p class="text-gray-500 text-sm mt-1 font-medium">Scan your daily fuel</p>
        </div>

        <form class="space-y-5">
            <div>
                <input type="email" placeholder="student@college.edu" class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:outline-none focus:border-orange-500 transition-all font-medium text-gray-700">
            </div>
            <div>
                <input type="password" placeholder="Password (••••••••)" class="w-full px-5 py-4 rounded-2xl bg-gray-50 border-2 border-transparent focus:outline-none focus:border-orange-500 transition-all font-medium text-gray-700">
            </div>
            
            <button type="button" class="w-full bg-orange-500 hover:bg-orange-600 active:scale-95 text-white font-bold py-4 rounded-2xl shadow-lg shadow-orange-500/30 transition-all mt-6">
                Login to Dashboard
            </button>
        </form>
    </div>

</body>
</html>
