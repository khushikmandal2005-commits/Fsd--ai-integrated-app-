<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mess AI - Nutrition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
        /* Animated Background */
        .bg-magic {
            background: linear-gradient(-45deg, #ffd3b6, #ffaaa5, #a8e6cf, #dcedc1);
            background-size: 400% 400%;
            animation: gradientMove 10s ease infinite;
        }
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* Glass Effect */
        .glass-box {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="bg-magic min-h-screen pb-20">

    <header class="px-6 pt-12 pb-4">
        <a href="#" class="inline-block bg-white/50 w-10 h-10 rounded-full flex items-center justify-center mb-4 hover:bg-white transition-all"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-4xl font-extrabold text-gray-800 drop-shadow-sm">Lunch</h1>
        <p class="text-gray-700 font-semibold mt-1">Chole + 2 Roti + Rice</p>
    </header>

    <main class="px-6 max-w-md mx-auto space-y-6">
        
        <!-- Calorie & Rating Glass Card -->
        <div class="glass-box rounded-[2rem] p-6 shadow-xl flex justify-between items-center">
            <div>
                <p class="text-xs font-bold text-gray-500 uppercase tracking-widest mb-1">Total</p>
                <h2 class="text-5xl font-extrabold text-gray-900">580<span class="text-lg text-gray-600">kcal</span></h2>
            </div>
            
            <div class="relative w-20 h-20 rounded-full bg-gradient-to-tr from-green-400 to-emerald-500 shadow-inner flex flex-col items-center justify-center border-4 border-white">
                <span class="text-2xl font-black text-white">65</span>
                <span class="text-[9px] font-bold text-white/90 uppercase">Rating</span>
            </div>
        </div>

        <!-- Macros -->
        <div class="grid grid-cols-3 gap-4">
            <div class="glass-box rounded-2xl p-4 text-center transform hover:-translate-y-1 transition-all">
                <div class="text-blue-500 text-xl mb-2"><i class="fa-solid fa-dna"></i></div>
                <p class="text-xl font-bold text-gray-800">18g</p>
                <p class="text-xs font-bold text-gray-500">PRO</p>
            </div>
            <div class="glass-box rounded-2xl p-4 text-center transform hover:-translate-y-1 transition-all">
                <div class="text-orange-500 text-xl mb-2"><i class="fa-solid fa-wheat-awn"></i></div>
                <p class="text-xl font-bold text-gray-800">85g</p>
                <p class="text-xs font-bold text-gray-500">CARBS</p>
            </div>
            <div class="glass-box rounded-2xl p-4 text-center transform hover:-translate-y-1 transition-all">
                <div class="text-yellow-500 text-xl mb-2"><i class="fa-solid fa-droplet"></i></div>
                <p class="text-xl font-bold text-gray-800">14g</p>
                <p class="text-xs font-bold text-gray-500">FATS</p>
            </div>
        </div>
        
    </main>
</body>
</html>
