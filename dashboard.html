<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ResuCoach AI - Career Dashboard & History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/resumeEngine.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        html { scroll-behavior: smooth; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #F5F0E6;
            color: #2d3748; 
            cursor: none; 
        }
        .glass-card { 
            background-color: #ffffff;
            border: 2px solid #D2B48C; 
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.4s ease;
        }
        .glass-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 30px 60px -12px rgba(109, 140, 166, 0.3);
            border-color: #6D8CA6;
        }
        
        .colorful-header {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.95), rgba(245, 240, 230, 0.95));
            backdrop-filter: blur(20px);
            border-bottom: 4px solid;
            border-image: linear-gradient(to right, #6D8CA6, #A7B89C, #D9A7A7, #D2B48C, #6D8CA6) 1;
        }

        #customCursor {
            position: fixed; top: 0; left: 0; width: 14px; height: 14px;
            background-color: #6D8CA6; border-radius: 50%; pointer-events: none;
            z-index: 9999; transform: translate(-50%, -50%); transition: transform 0.1s ease;
        }
        #cursorFollower {
            position: fixed; top: 0; left: 0; width: 44px; height: 44px;
            border: 2px solid #D9A7A7; border-radius: 50%; pointer-events: none;
            z-index: 9998; transform: translate(-50%, -50%); transition: width 0.3s, height 0.3s, border-color 0.3s;
        }
    </style>
</head>
<body class="min-h-screen pb-24 relative overflow-x-hidden">

    <!-- Interactive Physics Canvas Dot Matrix -->
    <canvas id="dotCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Kinetic Custom Cursor -->
    <div id="customCursor"></div>
    <div id="cursorFollower"></div>

    <!-- Animated Ambient Background Orbs -->
    <div class="absolute top-0 left-1/4 w-[30rem] h-[30rem] bg-[#A7B89C]/35 rounded-full blur-[100px] pointer-events-none z-0"></div>
    <div class="absolute top-1/3 right-1/4 w-[30rem] h-[30rem] bg-[#D9A7A7]/35 rounded-full blur-[100px] pointer-events-none z-0"></div>

    <!-- Colorful Header Navigation -->
    <header class="colorful-header sticky top-0 z-40 px-6 py-3.5 shadow-md">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <a href="index.html" class="interactive-hover bg-[#6D8CA6] hover:bg-[#5a7791] text-white px-4 py-1.5 rounded-xl text-xs font-bold transition-all flex items-center gap-2 shadow-sm">
                <i class="fa-solid fa-arrow-left"></i> Home & Upload
            </a>
            <h2 class="text-sm font-extrabold text-[#2d3748] tracking-tight flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-[#6D8CA6]"></i> Career Progress Dashboard
            </h2>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 pt-10 space-y-8 relative z-10">

        <!-- Banner -->
        <div class="reveal-elem glass-card rounded-3xl p-6 sm:p-8 space-y-3 border-2 border-[#D2B48C] shadow-sm">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-extrabold text-[#2d3748] tracking-tight">Career Readiness Summary</h3>
                <span class="bg-[#6D8CA6] text-white text-xs font-bold px-3 py-1 rounded-full shadow-sm">
                    ATS & Interview Prep
                </span>
            </div>
            <p class="text-xs text-slate-600 font-medium leading-relaxed">
                Track your ATS score improvements, practice mock interviews, and eliminate technical skill gaps to maximize interview callback rates.
            </p>
        </div>

        <!-- Chart: ATS Score History -->
        <div class="reveal-elem glass-card p-6 rounded-3xl border-2 border-[#D2B48C] shadow-sm space-y-3">
            <h4 class="text-xs font-extrabold text-[#2d3748] uppercase tracking-wider flex items-center justify-between">
                <span>ATS Resume Score Progression</span>
                <i class="fa-solid fa-chart-line text-[#6D8CA6]"></i>
            </h4>
            <div class="h-48 w-full relative">
                <canvas id="scoreHistoryChart"></canvas>
            </div>
        </div>

        <!-- History List -->
        <div class="reveal-elem space-y-4">
            <h4 class="text-xs font-extrabold uppercase tracking-wider text-[#6D8CA6]">Past Resume Scans & Mock Practice Sessions</h4>
            
            <div id="historyContainer" class="space-y-3">
                <!-- Dynamically loaded -->
            </div>
        </div>

    </main>

    <script>
        // Interactive Physics Canvas Dot Matrix (Translucent Dots: rgba(236, 72, 153, 0.20))
        const canvas = document.getElementById('dotCanvas');
        if (canvas) {
            const ctx = canvas.getContext('2d');
            let width = canvas.width = window.innerWidth;
            let height = canvas.height = window.innerHeight;

            window.addEventListener('resize', () => {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
                initDots();
            });

            const spacing = 40;
            let dots = [];
            let mouse = { x: -1000, y: -1000, radius: 140 };

            document.addEventListener('mousemove', (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            function initDots() {
                dots = [];
                for (let x = 20; x < width; x += spacing) {
                    for (let y = 20; y < height; y += spacing) {
                        dots.push({ baseX: x, baseY: y, x: x, y: y, vx: 0, vy: 0 });
                    }
                }
            }
            initDots();

            function animateDots() {
                ctx.clearRect(0, 0, width, height);
                ctx.fillStyle = 'rgba(236, 72, 153, 0.20)';

                for (let i = 0; i < dots.length; i++) {
                    const dot = dots[i];
                    const dx = mouse.x - dot.x;
                    const dy = mouse.y - dot.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < mouse.radius) {
                        const angle = Math.atan2(dy, dx);
                        const force = (mouse.radius - dist) / mouse.radius;
                        const pushX = Math.cos(angle) * force * 28;
                        const pushY = Math.sin(angle) * force * 28;

                        dot.vx -= pushX * 0.25;
                        dot.vy -= pushY * 0.25;
                    }

                    dot.vx += (dot.baseX - dot.x) * 0.08;
                    dot.vy += (dot.baseY - dot.y) * 0.08;
                    dot.vx *= 0.82;
                    dot.vy *= 0.82;

                    dot.x += dot.vx;
                    dot.y += dot.vy;

                    ctx.beginPath();
                    ctx.arc(dot.x, dot.y, 2.0, 0, Math.PI * 2);
                    ctx.fill();
                }
                requestAnimationFrame(animateDots);
            }
            animateDots();
        }

        // Custom Kinetic Cursor
        const customCursor = document.getElementById('customCursor');
        const cursorFollower = document.getElementById('cursorFollower');

        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let followerX = mouseX;
        let followerY = mouseY;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            gsap.to(customCursor, { x: mouseX, y: mouseY, duration: 0.1 });
        });

        function animateFollower() {
            followerX += (mouseX - followerX) * 0.15;
            followerY += (mouseY - followerY) * 0.15;
            gsap.set(cursorFollower, { x: followerX, y: followerY });
            requestAnimationFrame(animateFollower);
        }
        animateFollower();

        document.querySelectorAll('.interactive-hover').forEach(el => {
            el.addEventListener('mouseenter', () => gsap.to(cursorFollower, { width: 64, height: 64, borderColor: '#D9A7A7', duration: 0.3 }));
            el.addEventListener('mouseleave', () => gsap.to(cursorFollower, { width: 44, height: 44, borderColor: '#D9A7A7', duration: 0.3 }));
        });

        window.addEventListener('DOMContentLoaded', () => {
            gsap.from('.reveal-elem', { y: 40, opacity: 0, stagger: 0.15, duration: 1, ease: 'back.out(1.4)' });
        });

        function loadDashboard() {
            const history = ResuCoachEngine.getHistory();
            const container = document.getElementById('historyContainer');

            if (!history || history.length === 0) {
                container.innerHTML = `<div class="glass-card p-6 rounded-2xl text-center text-xs text-slate-500">No past resume scans recorded.</div>`;
                return;
            }

            container.innerHTML = history.map(item => `
                <div class="glass-card p-4 rounded-2xl border-2 border-[#D2B48C] flex justify-between items-center shadow-sm">
                    <div>
                        <span class="text-[10px] text-slate-500 font-bold uppercase">${new Date(item.scannedAt).toLocaleDateString()}</span>
                        <h5 class="text-sm font-extrabold text-[#2d3748]">${item.title}</h5>
                        <p class="text-xs text-[#6D8CA6] font-bold mt-0.5">Target: ${item.roleTitle}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="px-3.5 py-1 rounded-xl text-xs font-black bg-[#A7B89C] text-white shadow-sm">
                            ${item.overallScore}/100 ATS Score
                        </span>
                    </div>
                </div>
            `).join('');

            // Chart
            const ctx = document.getElementById('scoreHistoryChart').getContext('2d');
            const labels = history.map(h => new Date(h.scannedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })).reverse();
            const dataVals = history.map(h => h.overallScore).reverse();

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels.length > 0 ? labels : ['Scan 1', 'Scan 2', 'Latest'],
                    datasets: [{
                        label: 'ATS Score',
                        data: dataVals.length > 0 ? dataVals : [65, 72, 78],
                        borderColor: '#6D8CA6',
                        backgroundColor: 'rgba(109, 140, 166, 0.2)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.4,
                        pointBackgroundColor: '#6D8CA6'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { display: false } },
                        y: { beginAtZero: true, max: 100, grid: { color: '#e2d8c9' } }
                    }
                }
            });
        }

        loadDashboard();
    </script>
</body>
</html>
